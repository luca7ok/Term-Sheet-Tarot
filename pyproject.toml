[project]
name = "term-sheet-tarot"
version = "0.1.0"
description = "Turns a venture term sheet into a grounded risk table and a three-card tarot reading."
requires-python = ">=3.12,<3.13"
dependencies = [
    "pydantic>=2.14.3",
]

[dependency-groups]
dev = ["pytest>=9.2", "ruff>=0.8"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/tarot"]

[tool.ruff]
line-length = 100
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "SIM"]

[tool.pytest.ini_options]
testpaths = ["tests"]
