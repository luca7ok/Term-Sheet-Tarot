[project]
name = "term-sheet-tarot"
version = "0.1.0"
description = "Turns a venture term sheet into a grounded risk table and a three-card tarot reading."
requires-python = ">=3.12,<3.13"
dependencies = [
    "httpx>=0.28.1",
    "mcp>=2.3",
    "networkx>=3.7",
    "pydantic>=2.14.3",
    "qdrant-client>=1.20.0",
    "tokenizers>=0.23.3",
]

[project.optional-dependencies]
embed = [
    "sentence-transformers>=6.3.0",
]

[dependency-groups]
dev = [
    "pytest>=9.2",
    "pytest-cov>=7.1.0",
    "ruff>=0.8",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/tarot"]

[tool.ruff]
line-length = 100
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "SIM"]

[tool.pytest.ini_options]
testpaths = ["tests"]
