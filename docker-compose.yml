services:
  qdrant:
    image: qdrant/qdrant:v1.20.2
    ports:
      - "127.0.0.1:6333:6333"
      - "127.0.0.1:6334:6334"
    volumes:
      - ./.qdrant_storage:/qdrant/storage
  label-studio:
    image: heartexlabs/label-studio:1.23.2
    ports:
      - "127.0.0.1:8080:8080"
    volumes:
      - ./.label_studio:/label-studio/data
